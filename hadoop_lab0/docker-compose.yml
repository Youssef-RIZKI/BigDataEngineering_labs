services:
  hadoop-master:
    image: yassern1/hadoop-spark-jupyter:1.0.3
    container_name: hadoop-master
    hostname: hadoop-master
    ports:
      - "9870:9870"
      - "8088:8088"
      - "7077:7077"
      - "19888:19888"
      - "8080:8080"
      - "9000:9000"
    volumes:
      - ./hadoop_project:/shared_volume
    networks:
      - hadoop-net
    tty : True 
    stdin_open : True

  hadoop-slave1:
    image: yassern1/hadoop-spark-jupyter:1.0.3
    container_name: hadoop-slave1
    hostname: hadoop-slave1
    ports:
      - "8040:8042"
    networks:
      - hadoop-net
    tty : True 
    stdin_open : True

  hadoop-slave2:
    image: yassern1/hadoop-spark-jupyter:1.0.3
    container_name: hadoop-slave2
    hostname: hadoop-slave2
    ports:
      - "8041:8042"
    networks:
      - hadoop-net
    tty : True 
    stdin_open : True

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    hostname: kafka-ui
    networks:
      - hadoop-net
    ports:
      - 8081:8080
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=hadoop-master:9092
      - KAFKA_CLUSTERS_0_ZOOKEEPER=hadoop-master:2181 
    tty : True 
    stdin_open : True
  
  hive-server:
    image: apache/hive:4.0.0-alpha-2
    container_name: hive-server
    hostname: hive-server
    ports:
      - "10000:10000"  # JDBC port
      - "10002:10002"  # Web UI port
      - "9083:9083"    # Metastore port
    volumes:
      - ./hadoop_project:/shared_volume
    environment:
      - SERVICE_NAME=hiveserver2
    networks:
      - hadoop-net
    tty: true
    stdin_open: true

    
networks:
  hadoop-net:
    driver: bridge
